<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chocola · 3D y realidad aumentada</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,Arial,sans-serif;background:#151825;color:white}
model-viewer{display:block;width:100%;height:100dvh;background:radial-gradient(circle at 50% 45%,#353b51,#151825 75%)}
header{position:absolute;top:0;left:0;right:0;padding:20px 16px;text-align:center;pointer-events:none;z-index:2}
h1{font-size:22px;margin:0 0 5px}p{font-size:13px;margin:0;color:#d4d6e0}
.ar-button{display:flex;align-items:center;gap:8px;justify-content:center;background:#ff74ad;color:#251323;font-size:16px;font-weight:700;border:0;border-radius:40px;padding:15px 23px;box-shadow:0 4px 20px #0006;cursor:pointer}
footer{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:12px;color:#c6c7d0;pointer-events:none}
</style>
</head>
<body>
<header><h1>Chocola en 3D</h1><p>Gira con un dedo · Pellizca para acercar</p></header>
<model-viewer src="./modelo_3d.glb" alt="Modelo 3D Chocola" camera-controls auto-rotate shadow-intensity="1" exposure="1.1" ar ar-modes="scene-viewer webxr quick-look" ar-scale="auto" ar-placement="floor" interaction-prompt="auto" loading="eager">
<button class="ar-button" slot="ar-button" type="button">📱 Ver en mi habitación (AR)</button>
<div slot="poster" style="position:absolute;inset:0;display:grid;place-items:center">Cargando Chocola…</div>
</model-viewer>
<footer>La realidad aumentada requiere un Android compatible con ARCore</footer>
</body></html>
