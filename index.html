<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chocola · Modelo 3D</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#141822;color:#fff;font-family:system-ui,sans-serif}#info{position:fixed;top:18px;left:12px;right:12px;text-align:center;z-index:1;pointer-events:none;font-size:14px}#status{position:fixed;bottom:24px;left:12px;right:12px;text-align:center;z-index:1;font-size:14px}canvas{display:block;touch-action:none}</style></head><body><div id="info">Desliza para girar · Pellizca para acercar</div><div id="status">Cargando modelo 3D…</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
const statusEl=document.getElementById('status'),scene=new THREE.Scene();scene.background=new THREE.Color(0x141822);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.01,10000);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x777799,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(4,8,5);scene.add(light);
const controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
function loaded(gltf){const obj=gltf.scene;scene.add(obj);const bounds=new THREE.Box3().setFromObject(obj),center=bounds.getCenter(new THREE.Vector3()),size=bounds.getSize(new THREE.Vector3());obj.position.sub(center);const radius=Math.max(size.length()*0.5,0.01);camera.position.set(radius*.9,radius*.5,radius*2.4);camera.near=Math.max(radius/1000,.001);camera.far=radius*100;camera.updateProjectionMatrix();controls.target.set(0,0,0);controls.minDistance=radius*.2;controls.maxDistance=radius*12;controls.update();statusEl.textContent='Modelo listo ✓';setTimeout(()=>statusEl.style.display='none',3000);}
function failed(e){console.error(e);statusEl.textContent='Falta el archivo modelo_3d.glb o no se pudo cargar.';}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
(function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)})();
new THREE.GLTFLoader().load('./modelo_3d.glb',loaded,undefined,failed);
</script></body></html>
